name: Build ScreenWindow APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK for distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ScreenWindow-v1.1-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenWindow-v1.1-debug-apk
          path: dist/ScreenWindow-v1.1-debug.apk
          if-no-files-found: error
      - name: Publish prerelease APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1-debug >/dev/null 2>&1; then
            gh release upload v1.1-debug dist/ScreenWindow-v1.1-debug.apk --clobber
          else
            gh release create v1.1-debug dist/ScreenWindow-v1.1-debug.apk --target "$GITHUB_SHA" --title "ScreenWindow 1.1 (APK testowy)" --notes "Android debug APK do testów. Zgoda na przechwytywanie ekranu jest wymagana przez Androida." --prerelease
          fi
